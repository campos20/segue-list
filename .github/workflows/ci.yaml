name: CI

# Run this workflow on pull requests to main and when manually triggered.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "docs/**"
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for the coverage-comment step to post/update its PR comment.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx prettier --check . && npx eslint . --max-warnings 0

      - name: Test
        run: npx jest --coverage --ci

      # The web version (deployed to Pages by pages.yaml) has to keep
      # building, with the same Pages subpath the deploy uses.
      - name: Export web
        run: npx expo export --platform web --output-dir "$RUNNER_TEMP/web"
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}

      # Everything web-only lives in *.web.ts(x) files that Metro leaves out
      # of the iOS/Android bundles. This proves it: each marker below is a
      # string that exists only in one of those files (browserStorage.ts's
      # key prefix and error message, the web editor's iframe sandbox), so
      # finding one in the Android bundle means web code is shipping to
      # phones. Hermes bytecode keeps string literals as plain bytes, so
      # `grep -a` finds them.
      - name: Check web-only code stays out of the Android bundle
        run: |
          npx expo export --platform android --output-dir "$RUNNER_TEMP/android"
          BUNDLE="$(find "$RUNNER_TEMP/android/_expo/static/js/android" -name '*.hbc' | head -n 1)"
          if [ -z "$BUNDLE" ]; then
            echo "::error::No Android bundle found in the export."
            exit 1
          fi
          # Positive control: a string every build has, so a change in how
          # the bundle stores strings fails loudly instead of passing.
          if ! grep -a -q "segue-list-bundle" "$BUNDLE"; then
            echo "::error::Sanity check failed: couldn't find a known string in the Android bundle."
            exit 1
          fi
          # "code length overflow" is qrcode-generator's own error text: the QR
          # library is a web-only dependency (SendToPhoneButton.web.tsx).
          for marker in "segue-list:v1:" "Reload the page before making more changes" "allow-scripts" "send-to-phone-qr" "code length overflow"; do
            if grep -a -q -- "$marker" "$BUNDLE"; then
              echo "::error::Web-only code (\"$marker\") found in the Android bundle."
              exit 1
            fi
          done

      # Just a quick indicator on the PR itself - reads the json-summary
      # report jest already produces, no README to keep in sync.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.29
        with:
          coverage-summary-path: coverage/coverage-summary.json
