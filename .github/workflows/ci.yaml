name: CI

# Run this workflow on pull requests to main and when manually triggered.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
      - "docs/**"
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed for the coverage-comment step to post/update its PR comment.
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx prettier --check . && npx eslint . --max-warnings 0

      - name: Test
        run: npx jest --coverage --ci

      # Just a quick indicator on the PR itself - reads the json-summary
      # report jest already produces, no README to keep in sync.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: MishaKav/jest-coverage-comment@v1.0.29
        with:
          coverage-summary-path: coverage/coverage-summary.json
