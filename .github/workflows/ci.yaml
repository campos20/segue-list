name: CI

# Run this workflow on pull requests to main and when manually triggered.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Superseded runs on the same branch are pointless once a newer commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx prettier --check . && npx eslint . --max-warnings 0

      - name: Test
        run: npx jest --coverage --ci

      # Badges are generated from the coverage report, not hand-edited (see
      # the Testing section of the README). Regenerating here and diffing
      # catches a README a contributor forgot to update after adding tests,
      # without the workflow ever pushing a commit of its own.
      - name: Verify coverage badges are up to date
        run: |
          npx istanbul-badges-readme
          if ! git diff --exit-code README.md; then
            echo "::error::README coverage badges are stale - run 'npm run test:coverage && npm run coverage:badges' and commit the result."
            exit 1
          fi
